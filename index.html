<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TriGGer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/2026091.JPG" alt="Михаил" class="zoomable" width="200">
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img" src="">
</div>
        <h1>Привет, я Михаил  </h1>
        <h1>Начинающий Python-разработчик</h1>
    </header>
    <main>
        <h2>Обо мне</h2>
        <p>Учу Python, делаю ботов и парсеры.</p>
        <h2>Мои проекты</h2>
        <ul>
            <li>Программа-предсказатель</li>
            <li>Калькулятор</li>
            <li>Шар судьбы</li>
        </ul>   
        <h2>Мои сварочные работы</h2>
        <ul>
            <li>Печь типа (буржуйка) на отработке</li>
            <li>Мангал с ножками</li>
            <li>2-х спальная кровать</li>
        </ul>
    </main>
    <footer>
        <p>© 2026</p>
    </footer>
    <script>
    const images = document.querySelectorAll('.zoomable');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const close = document.querySelector('.close');

    images.forEach(img => {
        img.addEventListener('click', () => {
            lightbox.classList.add('active');
            lightboxImg.src = img.src;
        });
    });

    close.addEventListener('click', () => {
        lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
        }
    });
</script>
</body>
</html>
